# 标签系统多环境配置文件
# 支持环境：dev(开发)、test(测试)、pre(预发)、prod(生产)

# 开发环境配置
dev:
  mysql:
    host: rm-3ns765y13i6wf0hp3.mysql.rds.aliyuncs.com
    port: 3358
    database: biz_user
    user: dev_rw
    password: ""  # Set via MYSQL_PASSWORD environment variable
    charset: utf8mb4

  elasticsearch:
    hosts:
      - http://log-es.log-test.ops-k8s-prod.jcworkint.com
    index: user_tag_relation
    user: bigdata-service
    password: ""  # Set via ES_PASSWORD environment variable
    timeout: 60
    max_retries: 3

  spark:
    app_name: TagComputeEngine-Dev
    configs:
      spark.sql.adaptive.enabled: "true"
      spark.sql.adaptive.coalescePartitions.enabled: "true"
      spark.sql.adaptive.skewJoin.enabled: "true"
      spark.serializer: org.apache.spark.serializer.KryoSerializer

  maxcompute:
    project: test_ju_exchange
    access_id: ""  # Set via MAXCOMPUTE_ACCESS_ID environment variable
    access_key: ""  # Set via MAXCOMPUTE_ACCESS_KEY environment variable
    endpoint: https://service.ap-southeast-1.maxcompute.aliyun.com/api

